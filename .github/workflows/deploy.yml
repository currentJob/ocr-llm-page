name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 수동 트리거 허용

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 빌드 ──────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ocr-service-page/package-lock.json

      - name: Install dependencies
        working-directory: ocr-service-page
        run: npm ci

      - name: Build
        working-directory: ocr-service-page
        env:
          # 레포 이름을 base 경로로 사용 (예: /ocr/)
          VITE_BASE_URL: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ocr-service-page/dist

  # ── 배포 ──────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
